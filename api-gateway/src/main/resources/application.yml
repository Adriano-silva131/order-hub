server:
  port: 8000

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8090/.well-known/jwks.json}
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
          routes:
            - id: order-service-route
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/orders,/api/v1/orders/**
            - id: payment-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/payments/**
            - id: catalog-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/products,/api/v1/products/**
            - id: order-service-docs-route
              uri: http://localhost:8080
              predicates:
                - Path=/docs/orders/v3/api-docs,/docs/orders/v3/api-docs/**,/docs/orders/swagger-ui.html,/docs/orders/swagger-ui/**
              filters:
                - RewritePath=/docs/orders/(?<segment>.*), /$\{segment}
            - id: catalog-service-docs-route
              uri: http://localhost:8081
              predicates:
                - Path=/docs/products/v3/api-docs,/docs/products/v3/api-docs/**,/docs/products/swagger-ui.html,/docs/products/swagger-ui/**
              filters:
                - RewritePath=/docs/products/(?<segment>.*), /$\{segment}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
