name: OrderHub CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build & Test - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - catalog-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permissão de execução ao Gradle
        run: chmod +x ./${{ matrix.service }}/gradlew

      - name: Build com Gradle (incluindo testes)
        working-directory: ./${{ matrix.service }}
        run: ./gradlew build

      - name: Scan de vulnerabilidades de dependências (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ matrix.service }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Publicar resultado do Trivy na aba Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-${{ matrix.service }}
