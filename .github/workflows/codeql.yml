name: CodeQL

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - catalog-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          source-root: ${{ matrix.service }}

      - name: Dar permissão de execução ao Gradle
        run: chmod +x ./${{ matrix.service }}/gradlew

      - name: Build (para o CodeQL analisar os bytecodes gerados)
        working-directory: ./${{ matrix.service }}
        run: ./gradlew build -x test

      - name: Executar análise do CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-${{ matrix.service }}
