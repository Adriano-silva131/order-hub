apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: orderhub
data:
  KAFKA_BROKERS: kafka:9092
  KAFKA_CONSUMER_GROUP_ID: payment-group
  DLT_REPROCESS_INTERVAL_MS: "60000"
  PAYMENT_SUCCESS_URL: http://localhost:8000/checkout/success
  PAYMENT_CANCEL_URL: http://localhost:8000/checkout/cancel

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: orderhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: orderhub/payment-service-go:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: payment-service-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: DATABASE_URL
              value: postgres://$(DB_USERNAME):$(DB_PASSWORD)@postgres:5432/paymentdb?sslmode=disable
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-service-secret
                  key: stripe-secret-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-service-secret
                  key: stripe-webhook-secret
            - name: MERCADOPAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: payment-service-secret
                  key: mercadopago-access-token
            - name: MERCADOPAGO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-service-secret
                  key: mercadopago-webhook-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 15

---

apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: orderhub
spec:
  selector:
    app: payment-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP

---

# Ideal candidate for KEDA with KafkaTopic trigger on payment-group lag
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service-hpa
  namespace: orderhub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
