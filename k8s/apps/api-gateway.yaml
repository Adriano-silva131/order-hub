apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: orderhub
data:
  SPRING_PROFILES_ACTIVE: kubernetes
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  # JWT validation — Keycloak service DNS
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/orderhub
  # Routes — using k8s service DNS instead of fixed IPs
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: order-service-route
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://order-service:8080
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: "Path=/api/v1/orders,/api/v1/orders/**"
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID: catalog-service-route
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: http://catalog-service:8081
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: "Path=/api/v1/products,/api/v1/products/**"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: orderhub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: orderhub/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-gateway-config
          resources:
            requests:
              cpu: 128m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15

---

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: orderhub
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
  type: LoadBalancer

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: orderhub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
