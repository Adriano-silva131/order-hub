apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: orderhub
type: Opaque
data:
  username: b3JkZXJkYg==   # orderdb
  password: cG9zdGdyZXM=   # postgres

---

apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: orderhub
type: Opaque
data:
  root-username: YWRtaW4=   # admin
  root-password: YWRtaW4=   # admin
  uri: bW9uZ29kYjovL2FkbWluOmFkbWluQG1vbmdvZGI6MjcwMTcvY2F0YWxvZ2RiP2F1dGhTb3VyY2U9YWRtaW4=
  # mongodb://admin:admin@mongodb:27017/catalogdb?authSource=admin

---

apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: orderhub
type: Opaque
data:
  admin-username: YWRtaW4=   # admin
  admin-password: YWRtaW4=   # admin

---

apiVersion: v1
kind: Secret
metadata:
  name: notification-secret
  namespace: orderhub
type: Opaque
data:
