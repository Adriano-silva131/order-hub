spring.application.name=order-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8080}
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:order-group}

# Feign client base URL for catalog-service. Was only defined in the
# gitignored application-local.properties with no fallback, so CI (a clean
# checkout with no local profile file) failed to resolve the placeholder.
integration.catalog.url=${INTEGRATION_CATALOG_URL:http://localhost:8081/api/v1/products}

# DLT reprocessing interval in milliseconds (default: 30 minutes)
dlt.reprocess.interval=60000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Aponta o Swagger UI para o caminho externo roteado pelo api-gateway
# (SPRINGDOC_SWAGGER_UI_URL=/docs/orders/v3/api-docs no docker-compose);
# em dev local direto (./gradlew bootRun) usa o caminho padrão do springdoc.
springdoc.swagger-ui.url=${SPRINGDOC_SWAGGER_UI_URL:/v3/api-docs}